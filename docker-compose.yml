services:
  ayah-studio:
    build: .
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      # Moves output/ and assets/ (downloaded caches, uploads, generated
      # placeholders -- everything except the image-bundled fonts) onto the
      # mounted volume below, so they survive restarts and rebuilds. Unset
      # this (or the volume) and the app still works, just without
      # persistence -- see server/src/lib/paths.js.
      - DATA_DIR=/data
      # Optional -- only needed for AI-generated background video. Set it in
      # a real .env file (or your shell) rather than hardcoding it here.
      - RUNWAYML_API_SECRET=${RUNWAYML_API_SECRET:-}
    volumes:
      - ayah-data:/data

volumes:
  ayah-data:
